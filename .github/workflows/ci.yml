name: Validate Brisa
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser checks
        run: |
          npm run preview -- --port 5174 --strictPort &
          npm run preview -- --port 5175 --strictPort &
          for port in 5174 5175; do
            for attempt in $(seq 1 30); do
              curl -fsS http://localhost:$port/ >/dev/null && break
              sleep 1
            done
          done
          npm run test:ui
          npm run test:features
          npm run test:voices
          npm run test:offline
          node scripts/check-haptics.mjs
